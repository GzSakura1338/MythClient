plugins {
    id 'fabric-loom' version '1.7.4'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    accessWidenerPath = file("src/main/resources/mio.accesswidener")
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MixinExtras (used by the mixins)
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.4.1")))

    // Discord Rich Presence (vendored com.jagrosh.discordipc) transitive libraries
    implementation "net.lenni0451:Reflect:1.4.0"
    implementation "com.kohlschutter.junixsocket:junixsocket-core:2.10.1"

    // gson / brigadier are provided by MC
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
    // decompiled code: don't fail the whole build on warnings
    it.options.compilerArgs += ['-nowarn','-Xlint:none','-Xmaxerrs','100000','-Xmaxwarns','0']
}
