<!doctype html>
<meta charset="utf-8">
<title>H264 loading</title>
<style>body{background:#141720;color:#e6edf8;font:16px system-ui}video{width:640px;max-width:100%}</style>
<h2>Real H.264/AAC playback and seeking</h2>
<video controls muted playsinline src="fixtures/bear.mp4"></video><pre></pre>
<script>
const video=document.querySelector('video'),report=document.querySelector('pre');
let finished=false;
function finish(ok,message){if(finished)return;finished=true;document.title=(ok?'H264 PASS ':'H264 FAIL ')+message;report.textContent=document.title;}
video.onerror=()=>finish(false,'media error '+video.error?.code+': '+video.error?.message);
setTimeout(()=>finish(false,'playback timeout'),15000);
(async()=>{try{
 const audioContext=new OfflineAudioContext(2,44100,44100);
 const response=await fetch('fixtures/bear.mp4');
 if(!response.ok)throw Error('media fixture HTTP '+response.status);
 const audio=await audioContext.decodeAudioData(await response.arrayBuffer());
 if(audio.numberOfChannels<1||audio.length<1)throw Error('AAC decoded no samples');
 await video.play();
 await new Promise(resolve=>{const poll=()=>video.currentTime>.4?resolve():setTimeout(poll,50);poll();});
 video.pause();
 await new Promise(resolve=>{video.addEventListener('seeked',resolve,{once:true});video.currentTime=Math.min(video.duration*.5,1.5);});
 const position=video.currentTime;
 await video.play();await new Promise(resolve=>setTimeout(resolve,500));
 const frames=video.getVideoPlaybackQuality().totalVideoFrames;
 finish(video.currentTime>position+.1&&frames>0,'frames='+frames+' AAC='+audio.numberOfChannels+'ch/'+audio.length+'samples seek='+position.toFixed(2)+' resumed='+video.currentTime.toFixed(2));
}catch(e){finish(false,e.name+': '+e.message);}})();
</script>
