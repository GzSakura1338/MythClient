<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - StarainClient 管理系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="brand-header">
            <span class="brand-spike">✦</span>
            <h1 class="brand-title">StarainClient</h1>
            <p class="brand-subtitle">身份验证与授权中心</p>
        </div>

        <div class="error-banner" id="error-banner">
            用户名或密码不正确，请重新尝试。
        </div>

        <form action="/admin/login" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">管理员账户</label>
                <input class="form-input" type="text" id="username" name="username" required autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">验证密码</label>
                <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button class="submit-btn" type="submit">授权并登录</button>
        </form>
    </div>
    <script src="/admin/js/login.js"></script>
</body>
</html>
