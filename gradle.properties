# Trimmed to leave the Windows commit limit something for the client: the daemon idles at ~600M,
# and parallel execution buys nothing in a single-module build while costing a worker JVM. Loom's
# remap and decompile tasks are the only heavy ones and they are cached - if one ever fails with
# "Java heap space", put this back to 2G for that build.
org.gradle.jvmargs=-Xmx1G -XX:CICompilerCount=4 -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.configuration-cache=true

