plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'DevAuth'
        url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1'
        content { includeGroup 'me.djtheredstoner' }
    }
}

loom {
    runs {
        client {
            property 'devauth.enabled', 'true'
            property 'devauth.account', 'main'
            // This machine's Windows commit limit (physical + a page file pinned at 16G) is the
            // binding constraint, not physical memory - crashes read "Native memory allocation
            // (malloc) failed" with free commit at 3M while 2.9G of RAM sat unused. Every flag here
            // shrinks what the JVM asks the OS to commit.
            //
            // The heap would otherwise be sized at a quarter of physical memory; 2G is more than
            // the client uses. CICompilerCount is the big one: left to itself the JVM scaled it to
            // 15 off the CPU count, and every crash log died in a C2 CompilerThread allocating a
            // ~14M Chunk, so fifteen arenas were competing for the native memory that had run out.
            // Four keeps tiered warmup healthy. The code cache peaked at 42M of its 240M
            // reservation, and metaspace defaults to unlimited.
            vmArgs '-Xmx2G', '-XX:CICompilerCount=4', '-XX:ReservedCodeCacheSize=192m',
                    '-XX:MaxMetaspaceSize=512m'
        }
    }
}

// All Java sources share one directory.
sourceSets {
    main {
        java {
            setSrcDirs(['src'])
            exclude 'resources/**'
        }
        resources.setSrcDirs(['src/resources'])
    }
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    localRuntime "me.djtheredstoner:DevAuth-fabric:${project.devauth_version}"

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation include("io.github.spair:imgui-java-binding:${project.imgui_version}")
    implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}") {
        transitive = false // Use Minecraft's LWJGL runtime.
    }
    include("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}") {
        transitive = false
    }
    runtimeOnly include("io.github.spair:imgui-java-natives-windows:${project.imgui_version}")
}

processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
